# Despliegue en el VPS:   docker compose up -d --build
# Abrir:                  http://IP-DEL-VPS:8080   (cambiar el puerto con la variable PUERTO, p. ej. PUERTO=80)
name: prediccion-mora

services:
  prediccion-mora:
    build: .
    image: prediccion-mora:1.0
    container_name: prediccion-mora
    restart: unless-stopped
    ports:
      - "${PUERTO:-8080}:8080"
    # El contenedor no necesita escribir nada salvo los temporales de nginx.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/salud"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
